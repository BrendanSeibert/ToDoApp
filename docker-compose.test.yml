services:
  neo4j-test:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/integration-test-password
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p integration-test-password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      NEO4J_URI: bolt://neo4j-test:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: integration-test-password
      SESSION_SECRET: integration-test-session-secret
      PORT: 3000
    depends_on:
      neo4j-test:
        condition: service_healthy

  backend-tests:
    build:
      context: ./backend
      target: test
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend
